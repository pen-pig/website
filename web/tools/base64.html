<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base64 编解码工具</title>
<!--
  插件式工具示例：直接放到 web/tools/ 目录，系统会自动扫描并在"工具"页列出。
  支持 .html 或 .php 两种扩展名；本工具为纯前端实现，无需 PHP。
-->
<style>
  body { font-family: "Microsoft YaHei", Arial, sans-serif; max-width: 640px; margin: 20px auto; padding: 0 16px; color: #333; }
  h1 { font-size: 18px; border-bottom: 2px solid #1e6bb8; padding-bottom: 8px; }
  textarea { width: 100%; height: 140px; box-sizing: border-box; padding: 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; margin: 8px 0; }
  button { padding: 8px 20px; border: none; border-radius: 6px; background: #1e6bb8; color: #fff; font-size: 14px; cursor: pointer; margin-right: 8px; }
  button:hover { opacity: .85; }
  .row-label { font-weight: 600; margin-top: 12px; }
  .hint { color: #888; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<h1>Base64 编解码工具</h1>
<p>将文本与 Base64 字符串互相转换，常用于简单编码查看。</p>

<div class="row-label">原文 / Base64</div>
<textarea id="input" placeholder="在这里粘贴文本或 Base64 字符串..."></textarea>

<div>
  <button onclick="doEncode()">编码为 Base64</button>
  <button onclick="doDecode()">解码为原文</button>
  <button onclick="document.getElementById('input').value='';">清空</button>
</div>

<div class="row-label">结果</div>
<textarea id="output" readonly placeholder="结果将显示在这里..."></textarea>

<p class="hint">说明：编码使用 UTF-8，中文可正常处理。本工具仅在浏览器本地运行，不会上传任何数据。</p>

<script>
function doEncode() {
  var v = document.getElementById('input').value;
  try {
    // UTF-8 安全编码（兼容中文）
    var bytes = unescape(encodeURIComponent(v));
    document.getElementById('output').value = btoa(bytes);
  } catch (e) {
    alert('编码失败：' + e.message);
  }
}

function doDecode() {
  var v = document.getElementById('input').value.replace(/\s+/g, '');
  try {
    var bytes = atob(v);
    document.getElementById('output').value = decodeURIComponent(escape(bytes));
  } catch (e) {
    alert('解码失败：请确认输入是合法的 Base64 字符串');
  }
}
</script>
</body>
</html>
